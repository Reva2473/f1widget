<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexGrid (F1Widget) — 1:1 P1T Android UI Preview</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 999px; }
    .tabular { font-variant-numeric: tabular-nums; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.88); }
    }
    .live-dot { animation: pulseDot 1.6s infinite ease-in-out; }
    .phone-frame {
      width: 392px;
      height: 832px;
      border-radius: 48px;
      border: 8px solid #26262B;
      box-shadow: 0 24px 60px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
      background: #0B0B0E;
      color: #F5F5F7;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }
    .phone-frame.light-mode {
      background: #F5F5F8;
      color: #111116;
      border-color: #D0D0DA;
    }
    .glass-pill {
      background: rgba(28, 28, 34, 0.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-4 select-none">

  <div class="max-w-6xl mx-auto flex flex-col lg:flex-row gap-6 items-start justify-center">
    
    <!-- Left Column: Screen Switcher & Controls -->
    <div class="w-full lg:w-80 bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-4 shrink-0">
      <div>
        <div class="flex items-center justify-between">
          <span class="text-xs font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-red-500/15 text-red-400 font-semibold">com.reva2473.f1widget</span>
          <span class="text-xs text-[var(--muted-foreground)] font-mono">v2.0.0</span>
        </div>
        <h1 class="text-lg font-bold mt-1.5">ApexGrid Android Simulator</h1>
        <p class="text-xs text-[var(--muted-foreground)] mt-0.5">Click any screen preset below or interact directly inside the Android phone frame.</p>
      </div>

      <!-- 11 Official Screenshot Presets + Widgets -->
      <div class="space-y-1.5">
        <div class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">11 Reference Screens + Widgets</div>
        <div id="screen-buttons" class="grid grid-cols-1 gap-1.5"></div>
      </div>

      <!-- Team Colour Accent Picker -->
      <div class="pt-2 border-t border-[var(--border)] space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Team Colour Accent</span>
          <span id="active-team-label" class="text-xs font-mono text-red-400">Ferrari</span>
        </div>
        <div id="team-swatches" class="flex flex-wrap gap-2"></div>
      </div>
    </div>

    <!-- Center Column: Interactive Phone Frame -->
    <div class="flex flex-col items-center">
      <div id="phone" class="phone-frame flex flex-col">
        
        <!-- Radial Header Glow -->
        <div id="header-glow" class="absolute top-0 left-0 right-0 h-80 pointer-events-none transition-all duration-500"
             style="background: radial-gradient(circle at 50% 0%, rgba(155, 28, 28, 0.72) 0%, rgba(88, 19, 19, 0.38) 48%, rgba(11, 11, 14, 0) 100%);">
        </div>

        <!-- Status Bar -->
        <div class="relative z-20 flex items-center justify-between px-7 pt-3 pb-1 text-xs font-semibold tracking-tight">
          <span id="status-clock" class="tabular text-[13px] font-bold">09:08</span>
          <div class="w-24 h-6 bg-black rounded-full border border-white/5 flex items-center justify-end pr-2.5">
            <div class="w-2 h-2 rounded-full bg-[#1a2744] border border-blue-400/30"></div>
          </div>
          <div class="flex items-center gap-1.5 text-[11px]">
            <span>••••</span>
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zm6-4a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zm6-3a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/></svg>
            <div class="w-5 h-2.5 border border-white/60 rounded-sm p-0.5 flex items-center"><div class="w-full h-full bg-white rounded-[1px]"></div></div>
          </div>
        </div>

        <!-- Dynamic Screen Viewport -->
        <div id="screen-content" class="relative z-10 flex-1 overflow-y-auto pb-24"></div>

        <!-- Floating Pill Bottom Navigation Bar (shown on main tabs) -->
        <div id="bottom-nav-container" class="absolute bottom-4 left-0 right-0 z-30 flex justify-center pointer-events-none">
          <div class="glass-pill rounded-full px-3 py-1.5 flex items-center gap-2 pointer-events-auto">
            <button onclick="selectScreen('home')" id="tab-home" class="flex flex-col items-center justify-center w-20 py-1 rounded-full transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
              <span class="text-[11px] font-medium mt-0.5">Home</span>
            </button>
            <button onclick="selectScreen('race-weekend')" id="tab-season" class="flex flex-col items-center justify-center w-20 py-1 rounded-full transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18M8 13h2m4 0h2M8 17h2m4 0h2"/></svg>
              <span class="text-[11px] font-medium mt-0.5">Season</span>
            </button>
            <button onclick="selectScreen('widgets')" id="tab-settings" class="flex flex-col items-center justify-center w-20 py-1 rounded-full transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
              <span class="text-[11px] font-medium mt-0.5">Settings</span>
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const TEAMS = [
      { id: 'ferrari', name: 'Ferrari', color: '#E1251B', glow: 'rgba(155, 28, 28, 0.72)' },
      { id: 'mercedes', name: 'Mercedes', color: '#00D2BE', glow: 'rgba(0, 145, 130, 0.65)' },
      { id: 'mclaren', name: 'McLaren', color: '#FF8000', glow: 'rgba(180, 88, 0, 0.68)' },
      { id: 'redbull', name: 'Red Bull', color: '#3671C6', glow: 'rgba(38, 85, 165, 0.68)' },
      { id: 'aston', name: 'Aston Martin', color: '#229971', glow: 'rgba(22, 115, 82, 0.68)' },
      { id: 'alpine', name: 'Alpine', color: '#FF87BC', glow: 'rgba(168, 60, 110, 0.65)' },
      { id: 'williams', name: 'Williams', color: '#64C4FF', glow: 'rgba(40, 115, 175, 0.65)' }
    ];

    const SCREENS = [
      { id: 'home', label: '1. Home — Next GP & Live Map', clock: '09:08', showBottomNav: true, navTab: 'home' },
      { id: 'home-welcome', label: '2. Home — Welcome Slide', clock: '09:08', showBottomNav: true, navTab: 'home' },
      { id: 'driver-standings', label: '3. Driver Standings (2026)', clock: '09:11', showBottomNav: false },
      { id: 'constructor-standings', label: '4. Constructor Standings (2026)', clock: '09:12', showBottomNav: false },
      { id: 'race-weekend', label: '5. Race Weekend (Brazil 2026)', clock: '09:09', showBottomNav: true, navTab: 'season' },
      { id: 'race-results', label: '6. Race Results (São Paulo 2024)', clock: '09:13', showBottomNav: false },
      { id: 'race-stints', label: '7. Tyre Stints (Abu Dhabi 2023)', clock: '10:36', showBottomNav: false },
      { id: 'driver-profiles', label: '8. Driver Profiles (1950–2026)', clock: '09:13', showBottomNav: false },
      { id: 'compare-drivers', label: '9. Compare Drivers (VER vs NOR)', clock: '09:14', showBottomNav: false },
      { id: 'live-timing', label: '10. Live Timing (Q1 Track & Radio)', clock: '09:09', showBottomNav: false },
      { id: 'live-driver', label: '11. Live Timing (HAM Selected)', clock: '09:09', showBottomNav: false },
      { id: 'widgets', label: '12. 7 Home Widgets & Settings', clock: '09:15', showBottomNav: true, navTab: 'settings' }
    ];

    let state = {
      currentScreen: 'home',
      team: TEAMS[0],
      selectedLiveDriver: null,
      compareSwapped: false,
      radioPlaying: false,
      seasonFilterYear: '2026',
      tick: 0
    };

    // Track path coordinates for Bahrain/Sepang Live Map (0..1 normalized on 280x190 viewBox)
    const LIVE_TRACK_POINTS = [
      [140, 128], [72, 134], [52, 125], [46, 108], [62, 102], [44, 92], [50, 68],
      [75, 46], [122, 26], [148, 22], [156, 44], [168, 66], [202, 62], [220, 74],
      [246, 102], [254, 122], [242, 132], [190, 118], [164, 125], [176, 146],
      [168, 174], [146, 168], [116, 148], [86, 156], [70, 146], [108, 136]
    ];

    const LIVE_DRIVERS_MAP = [
      { code: 'VER', color: '#3671C6', offset: 0.72 },
      { code: 'HAM', color: '#E1251B', offset: 0.80 },
      { code: 'LEC', color: '#E1251B', offset: 0.84 },
      { code: 'NOR', color: '#FF8000', offset: 0.14 },
      { code: 'PIA', color: '#FF8000', offset: 0.66 },
      { code: 'ANT', color: '#00D2BE', offset: 0.42 },
      { code: 'RUS', color: '#00D2BE', offset: 0.70 },
      { code: 'HAD', color: '#3671C6', offset: 0.75 },
      { code: 'ALO', color: '#229971', offset: 0.88 },
      { code: 'STR', color: '#229971', offset: 0.94 },
      { code: 'GAS', color: '#FF87BC', offset: 0.82 },
      { code: 'OCO', color: '#B6BABD', offset: 0.77 },
      { code: 'ALB', color: '#64C4FF', offset: 0.36 },
      { code: 'SAI', color: '#64C4FF', offset: 0.40 },
      { code: 'LAW', color: '#6692FF', offset: 0.50 },
      { code: 'COL', color: '#64C4FF', offset: 0.54 },
      { code: 'BEA', color: '#B6BABD', offset: 0.25 },
      { code: 'HUL', color: '#52E252', offset: 0.30 }
    ];

    function getPointOnTrack(t) {
      const n = LIVE_TRACK_POINTS.length;
      const pos = ((t % 1) + 1) % 1 * n;
      const i = Math.floor(pos);
      const frac = pos - i;
      const p1 = LIVE_TRACK_POINTS[i % n];
      const p2 = LIVE_TRACK_POINTS[(i + 1) % n];
      return [p1[0] + (p2[0] - p1[0]) * frac, p1[1] + (p2[1] - p1[1]) * frac];
    }

    function renderLiveTrackSvg(selectedCode, compact = false) {
      const pathD = LIVE_TRACK_POINTS.map((p, idx) => (idx === 0 ? `M ${p[0]} ${p[1]}` : `L ${p[0]} ${p[1]}`)).join(' ') + ' Z';
      let markersHtml = '';
      LIVE_DRIVERS_MAP.forEach((d) => {
        const [x, y] = getPointOnTrack(d.offset + state.tick * 0.0025);
        const isSelected = selectedCode === d.code;
        if (isSelected) {
          markersHtml += `
            <g class="cursor-pointer" onclick="toggleSelectDriver('${d.code}', event)">
              <circle cx="${x}" cy="${y}" r="13" fill="rgba(225,37,27,0.28)" stroke="#FFFFFF" stroke-width="2"/>
              <circle cx="${x}" cy="${y}" r="6" fill="#E1251B" stroke="#111" stroke-width="1.5"/>
              <rect x="${x + 12}" y="${y - 9}" width="32" height="17" rx="5" fill="#E1251B"/>
              <text x="${x + 28}" y="${y + 3}" text-anchor="middle" fill="#FFF" font-size="9" font-weight="800">${d.code}</text>
            </g>`;
        } else {
          markersHtml += `
            <g class="cursor-pointer" onclick="toggleSelectDriver('${d.code}', event)">
              <circle cx="${x}" cy="${y}" r="5" fill="${d.color}" stroke="#0E0E12" stroke-width="1.2"/>
              <rect x="${x + 7}" y="${y - 7}" width="26" height="14" rx="4" fill="rgba(16,16,22,0.88)" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
              <text x="${x + 20}" y="${y + 3}" text-anchor="middle" fill="#F0F0F5" font-size="7.5" font-weight="700">${d.code}</text>
            </g>`;
        }
      });

      return `
        <svg viewBox="0 0 290 192" class="w-full ${compact ? 'h-44' : 'h-56'} select-none">
          <path d="${pathD}" fill="none" stroke="#1D1D24" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="${pathD}" fill="none" stroke="#52525E" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
          <!-- Start/Finish Checkered Line -->
          <rect x="137" y="121" width="5" height="14" fill="#FFF"/>
          <rect x="137" y="121" width="2.5" height="3.5" fill="#000"/>
          <rect x="139.5" y="124.5" width="2.5" height="3.5" fill="#000"/>
          <rect x="137" y="128" width="2.5" height="3.5" fill="#000"/>
          <text x="68" y="124" fill="#9A9AA6" font-size="8" font-weight="700">S1</text>
          <text x="235" y="122" fill="#9A9AA6" font-size="8" font-weight="700">S2</text>
          <text x="76" y="166" fill="#9A9AA6" font-size="8" font-weight="700">S3</text>
          ${markersHtml}
        </svg>`;
    }

    function renderInterlagosSectorSvg() {
      return `

          <!-- Speed Trap Callout -->
          <g>
            <rect x="18" y="14" width="44" height="20" rx="3" fill="#E01A9F"/>
            <text x="40" y="23" text-anchor="middle" fill="#FFF" font-size="7" font-weight="800">SPEED</text>
            <text x="40" y="31" text-anchor="middle" fill="#FFF" font-size="7" font-weight="800">TRAP</text>
            <polyline points="62,24 73,24 73,54" fill="none" stroke="#E01A9F" stroke-width="1.5"/>
            <circle cx="73" cy="54" r="3" fill="#E01A9F"/>
          </g>
          <!-- Sector 1 (Red) -->
          <path d="M 118 43 L 62 58 C 40 65, 38 78, 48 86 C 55 92, 46 110, 48 122 C 52 135, 72 145, 185 176"
                fill="none" stroke="#E1251B" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Sector 2 (Cyan) -->
          <path d="M 185 176 C 212 183, 218 175, 220 148 C 221 132, 165 104, 152 94 C 138 82, 142 54, 175 50 C 194 48, 198 62, 184 72 C 174 80, 184 94, 205 80 C 228 64, 248 56, 260 68 C 266 74, 242 92, 238 112 C 234 128, 255 145, 275 156"
                fill="none" stroke="#00B4D8" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Sector 3 (Yellow) -->
          <path d="M 275 156 C 292 164, 302 138, 296 108 C 288 76, 274 52, 232 40 C 195 30, 158 32, 118 43"
                fill="none" stroke="#FFD100" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Sector Labels & Turn Numbers -->
          <text x="45" y="108" fill="#E1251B" font-size="6.5" font-weight="700" transform="rotate(82 45 108)">SECTOR 1</text>
          <text x="172" y="105" fill="#00B4D8" font-size="6.5" font-weight="700" transform="rotate(35 172 105)">SECTOR 2</text>
          <text x="218" y="36" fill="#FFD100" font-size="6.5" font-weight="700" transform="rotate(14 218 36)">SECTOR 3</text>
          <text x="31" y="74" fill="#DDD" font-size="7" font-weight="700">01</text>
          <text x="48" y="90" fill="#DDD" font-size="7" font-weight="700">02</text>
          <text x="40" y="136" fill="#DDD" font-size="7" font-weight="700">03</text>

          <text x="132" y="76" fill="#DDD" font-size="7" font-weight="700">06</text>
          <text x="155" y="60" fill="#DDD" font-size="7" font-weight="700">07</text>
          <text x="186" y="57" fill="#DDD" font-size="7" font-weight="700">08</text>
          <text x="182" y="82" fill="#DDD" font-size="7" font-weight="700">09</text>
          <text x="242" y="62" fill="#DDD" font-size="7" font-weight="700">10</text>
          <text x="228" y="104" fill="#DDD" font-size="7" font-weight="700">11</text>
          <text x="278" y="166" fill="#DDD" font-size="7" font-weight="700">12</text>
          <text x="299" y="126" fill="#DDD" font-size="7" font-weight="700">13</text>
          <text x="268" y="50" fill="#DDD" font-size="7" font-weight="700">14</text>
          <text x="175" y="28" fill="#DDD" font-size="7" font-weight="700">15</text>
        </svg>`;
    }

    function renderYasMarinaSectorSvg() {
      return `
        <svg viewBox="0 0 320 205" class="w-full h-52">
          <!-- Speed Trap Callout -->
          <g>
            <rect x="164" y="18" width="46" height="20" rx="3" fill="#E01A9F"/>
            <text x="187" y="27" text-anchor="middle" fill="#FFF" font-size="7" font-weight="800">SPEED</text>
            <text x="187" y="35" text-anchor="middle" fill="#FFF" font-size="7" font-weight="800">TRAP</text>
            <polyline points="164,28 145,28 145,48" fill="none" stroke="#E01A9F" stroke-width="1.5"/>
            <circle cx="145" cy="48" r="3" fill="#E01A9F"/>
          </g>
          <!-- Sector 1 (Red) -->
          <path d="M 136 82 L 136 146 C 136 154, 146 156, 178 152 C 190 150, 196 124, 212 126 C 232 128, 245 138, 265 138"

          <!-- Sector 2 (Cyan) -->
          <path d="M 265 138 C 292 138, 304 134, 290 122 C 260 98, 178 64, 126 38 C 118 34, 118 48, 110 50 C 92 54, 52 94, 22 136"

          <text x="232" y="148" fill="#DDD" font-size="7" font-weight="700">04</text>
          <text x="302" y="140" fill="#DDD" font-size="7" font-weight="700">05</text>
          <text x="118" y="30" fill="#DDD" font-size="7" font-weight="700">06</text>
          <text x="108" y="44" fill="#DDD" font-size="7" font-weight="700">07</text>
          <text x="82" y="66" fill="#DDD" font-size="7" font-weight="700">08</text>
          <text x="16" y="170" fill="#DDD" font-size="7" font-weight="700">09</text>
          <text x="48" y="122" fill="#DDD" font-size="7" font-weight="700">12</text>
          <text x="102" y="128" fill="#DDD" font-size="7" font-weight="700">14</text>

    }

    function renderHomeScreen(slideIndex = 0) {
      const heroContent = slideIndex === 0 ? `
        <div class="px-5 pt-2">
          <div class="text-[11px] font-mono tracking-[0.16em] uppercase font-bold" style="color:${state.team.color}">ROUND 16  ·  IN 1 DAY</div>
          <h2 class="text-[23px] font-black tracking-tight leading-tight mt-1">Bahrain Grand Prix in Malaysia</h2>
          <div class="text-[13px] text-zinc-200 mt-1">Sepang International Circuit</div>
          <div class="text-[12px] text-zinc-400">Kuala Lumpur, Malaysia</div>

          <div class="flex items-center justify-between mt-3">
            <div class="space-y-1 text-[12.5px] tabular">
              <div class="grid grid-cols-3 gap-3"><span class="font-bold text-white">FP1</span><span class="text-zinc-400">Fri</span><span class="font-bold">05:30</span></div>
              <div class="grid grid-cols-3 gap-3"><span class="font-bold text-white">FP2</span><span class="text-zinc-400">Fri</span><span class="font-bold">09:00</span></div>
              <div class="grid grid-cols-3 gap-3"><span class="font-bold text-white">FP3</span><span class="text-zinc-400">Sat</span><span class="font-bold">05:30</span></div>
              <div class="grid grid-cols-3 gap-3"><span class="font-bold text-white">Quali</span><span class="text-zinc-400">Sat</span><span class="font-bold">09:00</span></div>
              <div class="grid grid-cols-3 gap-3" style="color:${state.team.color}"><span class="font-bold">Race</span><span>Sun</span><span class="font-bold">08:00</span></div>

    function selectScreen(screenId) {
      state.currentScreen = screenId;
      if (screenId === 'live-driver') {
        state.selectedLiveDriver = 'HAM';
      } else if (screenId === 'live-timing') {
        state.selectedLiveDriver = null;
      }
      render();
    }

    function toggleSelectDriver(code, ev) {
      if (ev) ev.stopPropagation();
      if (state.currentScreen === 'home') {
        state.currentScreen = 'live-driver';
        state.selectedLiveDriver = code;
      } else {
        state.selectedLiveDriver = state.selectedLiveDriver === code ? null : code;
        state.currentScreen = state.selectedLiveDriver === 'HAM' ? 'live-driver' : 'live-timing';
      }
      render();
    }

    function setTeam(teamId) {
      const found = TEAMS.find(t => t.id === teamId);
      if (found) {
        state.team = found;
        render();
      }
    }

    function playTeamRadio() {
      state.radioPlaying = !state.radioPlaying;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.22);
      } catch (e) {}
      render();
    }

    function renderControls() {
      const btnContainer = document.getElementById('screen-buttons');
      btnContainer.innerHTML = SCREENS.map(s => {
        const active = state.currentScreen === s.id;
        return `
          <button onclick="selectScreen('${s.id}')"
                  class="w-full text-left px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center justify-between ${active ? 'bg-red-500/20 text-red-300 border border-red-500/40 font-semibold' : 'hover:bg-white/5 text-[var(--foreground)] border border-transparent'}">
            <span>${s.label}</span>
            ${active ? '<span>●</span>' : ''}
          </button>`;
      }).join('');

      const swatches = document.getElementById('team-swatches');
      swatches.innerHTML = TEAMS.map(t => `
        <button onclick="setTeam('${t.id}')" title="${t.name}"
                class="w-7 h-7 rounded-full border-2 transition ${state.team.id === t.id ? 'border-white scale-110' : 'border-transparent opacity-75 hover:opacity-100'}"

      `).join('');
      document.getElementById('active-team-label').textContent = state.team.name;
      document.getElementById('active-team-label').style.color = state.team.color;
    }

    function render() {
      renderControls();
      const meta = SCREENS.find(s => s.id === state.currentScreen) || SCREENS[0];
      document.getElementById('status-clock').textContent = meta.clock;
      document.getElementById('header-glow').style.background =
        `radial-gradient(circle at 50% 0%, ${state.team.glow} 0%, rgba(11, 11, 14, 0) 75%)`;

      const navContainer = document.getElementById('bottom-nav-container');
      navContainer.style.display = meta.showBottomNav ? 'flex' : 'none';

      ['home', 'season', 'settings'].forEach(tab => {
        const el = document.getElementById('tab-' + tab);
        if (!el) return;
        if (meta.navTab === tab) {
          el.style.color = state.team.color;
          el.style.background = 'rgba(255,255,255,0.08)';
        } else {
          el.style.color = '#A0A0AB';
          el.style.background = 'transparent';
        }
      });

      const viewport = document.getElementById('screen-content');
      switch (state.currentScreen) {
        case 'home': viewport.innerHTML = renderHomeScreen(0); break;
        case 'home-welcome': viewport.innerHTML = renderHomeScreen(1); break;
        case 'driver-standings': viewport.innerHTML = renderDriverStandingsScreen(); break;
        case 'constructor-standings': viewport.innerHTML = renderConstructorStandingsScreen(); break;
        case 'race-weekend': viewport.innerHTML = renderRaceWeekendScreen(); break;
        case 'race-results': viewport.innerHTML = renderRaceResultsScreen(); break;
        case 'race-stints': viewport.innerHTML = renderRaceStintsScreen(); break;
        case 'driver-profiles': viewport.innerHTML = renderDriverProfilesScreen(); break;
        case 'compare-drivers': viewport.innerHTML = renderCompareDriversScreen(); break;
        case 'live-timing': viewport.innerHTML = renderLiveTimingScreen(null); break;
        case 'live-driver': viewport.innerHTML = renderLiveTimingScreen('HAM'); break;
        case 'widgets': viewport.innerHTML = renderWidgetsAndSettingsScreen(); break;
      }
    }

    render();
    setInterval(() => {
      state.tick++;
      if (['home', 'home-welcome', 'live-timing', 'live-driver'].includes(state.currentScreen)) {
        render();
      }
    }, 900);
  </script>
