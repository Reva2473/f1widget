      height: 832px;

      border: 8px solid #232326;

      overflow: hidden;
      background: #141415;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }
    .glass-pill {
      background: rgba(25, 25, 28, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

    function getDriver(id) {
      if (!id) return DRIVER_DATA.ANT;
      const clean = id.toString().trim().toUpperCase().replace(/[^A-Z]/g, '');
      if (DRIVER_DATA[clean]) return DRIVER_DATA[clean];
      if (DRIVER_ALIASES[clean] && DRIVER_DATA[DRIVER_ALIASES[clean]]) {
        return DRIVER_DATA[DRIVER_ALIASES[clean]];
      }
      for (const k in DRIVER_DATA) {
        const d = DRIVER_DATA[k];
        const n = d.name.toUpperCase().replace(/[^A-Z]/g, '');
        const fn = d.fullName.toUpperCase().replace(/[^A-Z]/g, '');
        if (clean.includes(n) || n.includes(clean) || clean.includes(fn)) return d;
      }
      return DRIVER_DATA.ANT;
    }

    function getDriverHeadshotUrl(id) {
      const d = getDriver(id);
      return { local: d.headshot, cdn: d.cdnHeadshot, name: d.name, color: d.color };
    }

    function getDriverCutoutUrl(id) {
      const d = getDriver(id);
      return { local: d.cutout, cdn: d.cdnCutout, name: d.name, color: d.color };
    }

    function getTeamCarUrl(teamId) {
      const clean = (teamId || '').toString().toLowerCase().replace(/[\s_-]/g, '');
      for (const k in TEAM_CAR_MAP) {
        if (clean.includes(k) || (k === 'racingbulls' && clean.includes('rb')) || (k === 'aston' && clean.includes('martin')) || (k === 'audi' && clean.includes('sauber'))) {
          return TEAM_CAR_MAP[k];
        }
      }
      return TEAM_CAR_MAP.mercedes;
    }

      const d = getDriver(identifier);
      const color = teamColor || d.color;
      return `
        <div class="relative shrink-0 ${rounded} overflow-hidden bg-[#202023] border border-white/[0.09] shadow-sm select-none" style="width:${size}px; height:${size}px;">
          <img src="${d.headshot}" alt="${d.name}" class="w-full h-full object-cover object-top select-none pointer-events-none" onerror="if('${d.cdnHeadshot}')this.src='${d.cdnHeadshot}';">

              ${badgeText}
            </span>` : ''}
        </div>`;
    }

                      <div class="h-full bg-[#FF8000]" style="width: 60.5%;"></div>
                      <div class="h-full bg-white" style="width: 39.5%;"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          ` : ''}

          ${(activeTab === 'all' || activeTab === 'glance') ? `
          <!-- SECTION 5: 7 ANDROID GLANCE WIDGETS & SETTINGS -->
          <div class="space-y-3 pt-2">
            <div class="text-[11px] font-mono uppercase tracking-wider text-zinc-400 font-bold">7 GLANCE HOME SCREEN WIDGETS</div>

            <!-- Widget 1: Next GP Countdown -->
            <div class="rounded-2xl bg-[#19191b] border border-white/10 p-3.5 shadow-sm">
              <div class="flex justify-between items-start">
                <div>
                  <div class="text-[10px] font-mono uppercase font-bold" style="color:${state.team.color};">ROUND 16 · IN 1 DAY</div>
                  <div class="text-sm font-black text-white mt-0.5">Bahrain GP in Malaysia</div>
                  <div class="text-[11px] text-zinc-400 mt-0.5">Quali Sat 09:00 · Race Sun 08:00</div>
                </div>
                <span class="px-2 py-0.5 rounded bg-white/10 text-[10px] font-mono text-zinc-300">4×2 Widget</span>
              </div>
            </div>

            <!-- Widget 2: Favourite Driver & Team Side-by-Side (2x2 Small Widgets) -->
            <div class="grid grid-cols-2 gap-2.5">
              <div class="rounded-2xl bg-[#19191b] border border-[#00D2BE]/40 p-3 shadow-sm">
                <div class="text-[10px] font-mono text-[#00D2BE] font-bold">FAVOURITE DRIVER</div>
                <div class="text-sm font-extrabold text-white mt-0.5">K. Antonelli</div>
                <div class="text-xl font-black text-[#00D2BE] tabular mt-1 font-mono">P1 · 302 PTS</div>
                <div class="text-[10px] text-zinc-400 mt-0.5 font-mono">Form: P5, P1, P1</div>
              </div>
              <div class="rounded-2xl bg-[#19191b] border p-3 shadow-sm" style="border-color:${state.team.color}66;">
                <div class="text-[10px] font-mono font-bold" style="color:${state.team.color};">FAVOURITE TEAM</div>
                <div class="text-sm font-extrabold text-white mt-0.5">${state.team.name}</div>
                <div class="text-xl font-black tabular mt-1 font-mono" style="color:${state.team.color};">378 PTS</div>
                <div class="text-[10px] text-zinc-400 mt-0.5 font-mono">HAM 199 · LEC 179</div>
              </div>
            </div>

            <!-- Widget 3: WDC Standings Top 3 -->
            <div class="rounded-2xl bg-[#19191b] border border-white/10 p-3.5 space-y-1.5 text-xs tabular shadow-sm">
              <div class="flex justify-between text-[10px] font-mono text-zinc-400"><span>WDC STANDINGS WIDGET</span><span>2026</span></div>
              <div class="flex justify-between text-zinc-300"><span>1. Kimi Antonelli (MER)</span><b class="text-[#00D2BE] font-mono">302</b></div>
              <div class="flex justify-between text-zinc-300"><span>2. George Russell (MER)</span><b class="text-[#00D2BE] font-mono">236</b></div>
              <div class="flex justify-between text-zinc-300"><span>3. Lewis Hamilton (FER)</span><b class="text-[#E8002D] font-mono">199</b></div>
            </div>

            <!-- Team Colour Accent Selector inside Phone -->
            <div class="rounded-2xl bg-[#19191b] border border-white/10 p-3.5 space-y-2.5 shadow-sm">
              <div class="text-xs font-bold text-white">Your Team's Colour Accent</div>
              <div class="text-[11px] text-zinc-400">Set the accent to match the team you follow. The simulator updates seamlessly.</div>
              <div class="flex flex-wrap gap-2 pt-1">
                ${TEAMS.map(t => `
                  <button onclick="setTeam('${t.id}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold border transition flex items-center gap-1.5 ${state.team.id === t.id ? 'border-white bg-white/15 text-white' : 'border-white/10 bg-black/30 text-zinc-400 hover:text-white'}">
                    <span class="w-2.5 h-2.5 rounded-full" style="background:${t.color};"></span>
                    <span>${t.name}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
          ` : ''}
        </div>
      `;
    }

    let state = {
      currentScreen: 'driver-standings', // Default directly to Driver Standings per user test
      team: TEAMS[0],
      selectedLiveDriver: null,
      compareSwapped: false,
      radioPlaying: false,
      seasonFilterYear: '2026',
      liveSession: 'sao_paulo',
      timingTowerMode: 'interval',
      widgetGalleryTab: 'all',
      tick: 0
    };

    function selectScreen(screenId) {
      if (screenId === 'live-timing-sp') {
        state.currentScreen = 'live-timing-sp';
        state.liveSession = 'sao_paulo';
        state.selectedLiveDriver = null;
      } else if (screenId === 'live-driver') {
        state.currentScreen = 'live-driver';
        state.selectedLiveDriver = 'HAM';
      } else if (screenId === 'live-timing') {
        state.currentScreen = 'live-timing';
        state.selectedLiveDriver = null;
      } else {
        state.currentScreen = screenId;
      }
      render();
    }

    function setLiveSession(sessionKey) {
      state.liveSession = sessionKey;
      state.selectedLiveDriver = null;
      render();
    }

    function setWidgetGalleryTab(tabKey) {
      state.widgetGalleryTab = tabKey;
      render();
    }

    function toggleSelectDriver(code, ev) {
      if (ev) ev.stopPropagation();
      if (state.currentScreen === 'home') {
        state.currentScreen = 'live-driver';
        state.selectedLiveDriver = code;
      } else {
        state.selectedLiveDriver = state.selectedLiveDriver === code ? null : code;
      }
      render();
    }

    function setTeam(teamId) {
      const found = TEAMS.find(t => t.id === teamId);
      if (found) {
        state.team = found;
        render();
      }
    }

    function playTeamRadio() {
      state.radioPlaying = !state.radioPlaying;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.22);
      } catch (e) {}
      render();
    }

    function renderControls() {
      const btnContainer = document.getElementById('screen-buttons');
      btnContainer.innerHTML = SCREENS.map(s => {
        let active = state.currentScreen === s.id;
        if ((s.id === 'live-timing-sp' && (state.currentScreen === 'live-timing-sp' || (state.currentScreen === 'live-timing' && state.liveSession === 'sao_paulo'))) ||
            (s.id === 'live-timing' && state.currentScreen === 'live-timing' && state.liveSession === 'bahrain')) {
          active = true;
        }
        return `
          <button onclick="selectScreen('${s.id}')"
                  class="w-full text-left px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center justify-between ${active ? 'bg-white/15 text-white border border-white/20 font-bold shadow-sm' : 'hover:bg-white/5 text-zinc-400 border border-transparent hover:text-zinc-200'}">
            <span>${s.label}</span>
            ${active ? '<span class="text-xs text-white">●</span>' : ''}
          </button>`;
      }).join('');

      const swatches = document.getElementById('team-swatches');
      swatches.innerHTML = TEAMS.map(t => `
        <button onclick="setTeam('${t.id}')" title="${t.name}"
                class="w-7 h-7 rounded-full border-2 transition ${state.team.id === t.id ? 'border-white scale-110 shadow-md' : 'border-transparent opacity-75 hover:opacity-100'}"
                style="background:${t.color};"></button>
      `).join('');
      document.getElementById('active-team-label').textContent = state.team.name;
      document.getElementById('active-team-label').style.color = state.team.color;
    }

    function render() {
      renderControls();
      const meta = SCREENS.find(s => s.id === state.currentScreen) || SCREENS[2];
      document.getElementById('status-clock').textContent = meta.clock;

      // Header glow: subtle, quiet ambient glow that dynamically avoids clashing
      let glowColor = state.team.color;
      let glowOpacity = 0.22;
      if (state.currentScreen === 'driver-standings' || state.currentScreen === 'constructor-standings') {
        // P1 leader is Mercedes (Antonelli): use Mercedes teal at low opacity so it matches P1 card perfectly
        glowColor = '#00D2BE';
        glowOpacity = 0.16;
      } else if (state.currentScreen === 'race-results' || state.currentScreen === 'race-stints') {
        glowColor = '#3671C6';
        glowOpacity = 0.16;
      }
      document.getElementById('header-glow').style.background =
        `radial-gradient(circle at 50% -10%, ${glowColor}35 0%, ${glowColor}0D 45%, rgba(20, 20, 21, 0) 75%)`;

      const navContainer = document.getElementById('bottom-nav-container');
      navContainer.style.display = meta.showBottomNav ? 'flex' : 'none';

      ['home', 'season', 'settings'].forEach(tab => {
        const el = document.getElementById('tab-' + tab);
        if (!el) return;
        if (meta.navTab === tab) {
          el.style.color = state.team.color;
          el.style.background = 'rgba(255,255,255,0.08)';
        } else {
          el.style.color = '#8E8E93';
          el.style.background = 'transparent';
        }
      });

      const viewport = document.getElementById('screen-content');
      switch (state.currentScreen) {
        case 'home': viewport.innerHTML = renderHomeScreen(0); break;
        case 'home-welcome': viewport.innerHTML = renderHomeScreen(1); break;
        case 'driver-standings': viewport.innerHTML = renderDriverStandingsScreen(); break;
        case 'constructor-standings': viewport.innerHTML = renderConstructorStandingsScreen(); break;
        case 'race-weekend': viewport.innerHTML = renderRaceWeekendScreen(); break;
        case 'race-results': viewport.innerHTML = renderRaceResultsScreen(); break;
        case 'race-stints': viewport.innerHTML = renderRaceStintsScreen(); break;
        case 'driver-profiles': viewport.innerHTML = renderDriverProfilesScreen(); break;
        case 'compare-drivers': viewport.innerHTML = renderCompareDriversScreen(); break;
        case 'live-timing-sp':
        case 'live-timing':
          viewport.innerHTML = renderLiveTimingScreen(state.selectedLiveDriver);
          break;
        case 'live-driver':
          viewport.innerHTML = renderLiveTimingScreen('HAM');
          break;
        case 'widgets': viewport.innerHTML = renderWidgetsAndSettingsScreen(); break;
      }
    }

    render();
    setInterval(() => {
      state.tick++;
      if (['home', 'home-welcome', 'live-timing', 'live-timing-sp', 'live-driver'].includes(state.currentScreen)) {
        render();
      }
    }, 900);
  </script>
</body>
</html>
